<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
        }

        .product-card{
            background:white;
            border-radius:15px;
            padding:30px;
            margin-top:50px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        .product-image{
            width:100%;
            max-height:450px;
            object-fit:cover;
            border-radius:10px;
        }

        .price{
            color:#198754;
            font-size:32px;
            font-weight:bold;
        }

        .cart-link{
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="product-card">

        <div class="row">

            <div class="col-md-5">
                <img src="{{ product.image.url }}"
                     class="product-image">
            </div>

            <div class="col-md-7">

                <h1 class="mb-3">{{ product.name }}</h1>

                <p class="price">₹{{ product.price }}</p>

                <p class="text-muted">
                    {{ product.description }}
                </p>

                <p>
                    <strong>Available Stock:</strong>
                    {{ product.stock }}
                </p>

                <a href="{% url 'cart' %}" class="cart-link">
                    🛒 View Cart
                </a>

                <hr>

                <form method="POST" action="{% url 'add_to_cart' product.id %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            <strong>Quantity</strong>
                        </label>

                        <input
                            type="number"
                            name="quantity"
                            value="1"
                            min="1"
                            max="{{ product.stock }}"
                            class="form-control w-25">
                    </div>

                    <button type="submit"
                            class="btn btn-warning btn-lg">
                        🛒 Add To Cart
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
