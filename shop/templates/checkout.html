<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:40px auto;
        }

        h1{
            text-align:center;
            color:#2874f0;
            margin-bottom:30px;
        }

        .checkout{
            display:flex;
            gap:30px;
            flex-wrap:wrap;
        }

        .left{
            flex:2;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .right{
            flex:1;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
            height:fit-content;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:8px;
            font-weight:bold;
        }

        input,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            outline:none;
            font-size:15px;
        }

        textarea{
            resize:none;
            height:100px;
        }

        h2{
            margin-bottom:20px;
            color:#333;
        }

        .item{
            display:flex;
            justify-content:space-between;
            margin-bottom:12px;
            border-bottom:1px solid #eee;
            padding-bottom:10px;
        }

        .total{
            margin-top:20px;
            font-size:22px;
            color:green;
            font-weight:bold;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:15px;
            background:#2874f0;
            color:white;
            border:none;
            border-radius:6px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#0b5ed7;
        }

        .payment{
            margin-top:20px;
            background:#f8f8f8;
            padding:15px;
            border-radius:8px;
        }

        .payment input{
            width:auto;
        }

    </style>

</head>
<body>

<div class="container">

<h1>🛒 Secure Checkout</h1>

<form method="POST">

{% csrf_token %}

<div class="checkout">

<div class="left">

<h2>Delivery Details</h2>

{{ form.as_p }}

<div class="payment">

<h3>Payment Method</h3>

<label>
<input type="radio" checked>
Cash on Delivery
</label>

</div>

<button type="submit">
Place Order
</button>

</div>

<div class="right">

<h2>Order Summary</h2>

{% for item in cart_items %}

<div class="item">

<div>

<b>{{ item.product.name }}</b><br>

Quantity : {{ item.quantity }}

</div>

<div>

₹{{ item.product.price }}

</div>

</div>

{% endfor %}

<hr>

<div class="total">

Total : ₹{{ total }}

</div>

</div>

</div>

</form>

</div>

</body>
</html>
