<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
</head>
<body>

<h1>Checkout</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="name" placeholder="Full Name"><br><br>

    <input type="text" name="phone" placeholder="Phone Number"><br><br>

    <textarea name="address" placeholder="Address"></textarea><br><br>

    <button type="submit">
        Place Order
    </button>

</form>

</body>
</html>
