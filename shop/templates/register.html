
<!DOCTYPE html>
<html>
<head>
    <title>Register - Virtual Shopping</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2874f0,#4facfe);
        }

        .container{
            width:900px;
            background:white;
            display:flex;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0px 5px 20px rgba(0,0,0,0.3);
        }

        .left{
            width:40%;
            background:#2874f0;
            color:white;
            padding:50px 30px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .left h1{
            margin-bottom:20px;
            font-size:35px;
        }

        .left p{
            line-height:1.8;
            font-size:18px;
        }

        .right{
            width:60%;
            padding:40px;
        }

        .right h2{
            text-align:center;
            color:#2874f0;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:1px solid #ddd;
            border-radius:8px;
            outline:none;
        }

        input:focus{
            border:1px solid #2874f0;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:20px;
            background:#fb641b;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#e65c12;
        }

        .login-link{
            text-align:center;
            margin-top:15px;
        }

        .login-link a{
            color:#2874f0;
            text-decoration:none;
            font-weight:bold;
        }

    </style>
</head>
<body>

<div class="container">

    <div class="left">

        <h1>Virtual Shopping</h1>

        <p>
            Create your account and enjoy
            shopping with amazing offers,
            discounts and exciting products.
        </p>

    </div>

    <div class="right">

        <h2>Create Account</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <input type="password"
                   name="confirm_password"
                   placeholder="Confirm Password"
                   required>

            <button type="submit">
                Register
            </button>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </div>

    </div>

</div>

   
</div>

</body>
</html>
