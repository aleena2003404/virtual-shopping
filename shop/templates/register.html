<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f1f3f6;
        }

        .container{
            width:800px;
            margin:50px auto;
            display:flex;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        .left{
            width:40%;
            background:#2874f0;
            color:white;
            padding:40px;
        }

        .right{
            width:60%;
            padding:40px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:1px solid #ccc;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#fb641b;
            color:white;
            border:none;
            font-size:16px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="left">
        <h2>Register</h2>
        <p>Create your Virtual Shopping account.</p>
    </div>

    <div class="right">

       <form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username">

    <input type="email" name="email" placeholder="Email">

    <input type="password" name="password" placeholder="Password">

    <input type="password" name="confirm_password" placeholder="Confirm Password">

    <button type="submit">Register</button>
</form>

    </div>

</div>

</body>
</html>
