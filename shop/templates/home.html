<!DOCTYPE html>
<html>
<head>
    <title>Virtual Shopping</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f1f3f6;
        }

        .navbar{
            background:#2874f0;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            color:white;
            font-size:24px;
            font-weight:bold;
        }

        .search-box{
            width:40%;
            padding:10px;
            border:none;
            border-radius:5px;
        }

        .menu a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-weight:bold;
        }

        .banner{
            background:white;
            margin:20px;
            padding:50px;
            text-align:center;
            border-radius:10px;
        }

        .banner h1{
            color:#2874f0;
        }
        .categories{
    background:white;
    margin:20px;
    padding:20px;
    display:flex;
    justify-content:space-around;
    border-radius:10px;
}

.category{
    font-weight:bold;
    cursor:pointer;
}

.category:hover{
    color:#2874f0;
}
.products{
    display:flex;
    gap:20px;
    padding:20px;
    justify-content:center;
}

.card{
    background:white;
    width:250px;
    padding:15px;
    text-align:center;
    border-radius:10px;
    box-shadow:0px 2px 5px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
}

.card button{
    background:#2874f0;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}
.card{
    background:white;
    width:250px;
    padding:15px;
    text-align:center;
    border-radius:10px;
    box-shadow:0px 2px 10px rgba(0,0,0,0.15);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h3{
    margin-top:10px;
}

.card p{
    color:green;
    font-weight:bold;
    margin:10px 0;
}
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">Virtual Shopping</div>

        <input type="text" placeholder="Search Products..." class="search-box">

       <div class="menu">
    <a href="{% url 'login' %}">Login</a>
    <a href="{% url 'register' %}">Register</a>
    <a href="{% url 'cart' %}">Cart</a>
</div>
    </div>
    <div class="banner">
        <h1>Welcome to Virtual Shopping</h1>
        <p>Big Sale Up To 70% OFF</p>
    </div>
    <div class="categories">
    <div class="category">Mobiles</div>
    <div class="category">Fashion</div>
    <div class="category">Electronics</div>
    <div class="category">Books</div>
    <div class="category">Grocery</div>
    <div class="category">Beauty</div>
</div>


    
<div class="products">

    {% for product in products %}
    <div class="card">

        <img src="{{ product.image.url }}" alt="{{ product.name }}">

        <h3>{{ product.name }}</h3>

        <p>₹{{ product.price }}</p>
        <a href="{% url 'product_detail' product.id %}">
    <button>View Details</button>
</a>

        
   

    </div>
    {% endfor %}

</div>
</div>
<!-- <a href="{% url 'cart' %}">Cart</a> -->
</body>
</html>
