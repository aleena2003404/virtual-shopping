
<!DOCTYPE html>
<html>
<head>
    <title>Login - Virtual Shopping</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#28a0f0,#00aeff);
        }

        .container{
            width:850px;
            display:flex;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(10px);
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 8px 32px rgba(0,0,0,0.2);
        }

        .left{
            width:45%;
            background:#2874f0;
            color:white;
            padding:50px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .left h1{
            font-size:40px;
            margin-bottom:20px;
        }

        .left p{
            line-height:1.8;
            font-size:18px;
        }

        .right{
            width:55%;
            background:white;
            padding:50px;
        }

        .right h2{
            text-align:center;
            color:#2874f0;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:15px;
            margin-top:15px;
            border:1px solid #ddd;
            border-radius:10px;
            outline:none;
            font-size:15px;
        }

        input:focus{
            border:1px solid #2874f0;
        }

        button{
            width:100%;
            padding:15px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:#fb641b;
            color:white;
            font-size:17px;
            cursor:pointer;
        }

        button:hover{
            background:#e85a15;
        }

        .register-link{
            text-align:center;
            margin-top:20px;
        }

        .register-link a{
            text-decoration:none;
            color:#2874f0;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="left">

        <h1>Welcome Back!</h1>

        <p>
            Login to access your orders,
            cart, wishlist and enjoy
            seamless shopping experience.
        </p>

    </div>

    <div class="right">

        <h2>Login Account</h2>

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register-link">
            New User?
            <a href="{% url 'register' %}">
                Create Account
            </a>
        </div>

    </div>

</div>

</body>
</html>
