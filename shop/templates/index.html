
<!DOCTYPE html>
<html>
<head>
    <title>Virtual Shopping</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            background:url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=1600&q=80');
            background-size:cover;
            background-position:center;
        }

        .overlay{
            width:100%;
            height:100vh;
            background:rgba(0,0,0,0.6);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .content{
            text-align:center;
            color:white;
        }

        .content h1{
            font-size:60px;
            margin-bottom:20px;
        }

        .content p{
            font-size:22px;
            margin-bottom:40px;
        }

        .btn{
            display:inline-block;
            padding:15px 35px;
            margin:10px;
            border-radius:30px;
            text-decoration:none;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        .login{
            background:#2874f0;
            color:white;
        }

        .register{
            background:#fb641b;
            color:white;
        }

        .btn:hover{
            transform:translateY(-5px);
        }

    </style>
</head>
<body>

<div class="overlay">

    <div class="content">

        <h1>Virtual Shopping</h1>

        <p>
            Discover Amazing Products at Unbeatable Prices
        </p>

        <a href="{% url 'login' %}" class="btn login">
            Login
        </a>

        <a href="{% url 'register' %}" class="btn register">
            Register
        </a>

    </div>

</div>

</body>
</html>
